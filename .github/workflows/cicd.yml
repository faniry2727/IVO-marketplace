name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Test frontend
      - name: Setup Node & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm ci
          npm run build

      # 2. Test backend
      - name: Setup Python & Test Backend
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          cd backend
          pip install -r requirements.txt
          python3 -c "import main, database, security; print('Backend Python testé!')"

      # 3. Déploiement backend
      - name: Deploy Backend to Render
        if: success()
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # 4. Déploiement frontend
      - name: Deploy Frontend to Render
        if: success()
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"
