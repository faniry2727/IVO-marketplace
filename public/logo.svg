<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <!-- Icône Caddie IVO avec Pousse Verte -->
  <g transform="translate(10, 10)">
    <!-- Feuilles vertes au-dessus -->
    <path d="M 18,12 C 18,4 28,0 34,4 C 36,12 28,18 18,12 Z" fill="#15803d" />
    <path d="M 14,14 C 8,8 10,0 18,2 C 20,8 18,14 14,14 Z" fill="#16a34a" />
    
    <!-- Corps du Caddie Circulaire -->
    <circle cx="28" cy="34" r="22" stroke="#15803d" stroke-width="5" fill="none" />
    
    <!-- Chariot intérieur jaune/orange -->
    <path d="M 18,26 L 23,26 L 27,38 L 37,38 L 40,29 L 24,29" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="42" r="2.5" fill="#ea580c" />
    <circle cx="36" cy="42" r="2.5" fill="#ea580c" />
  </g>

  <!-- Texte IVO stylisé -->
  <text x="75" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#15803d" letter-spacing="-1">iVO</text>

  <!-- Slogan officiel Malagasy -->
  <g transform="translate(155, 26)">
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-style="italic" font-size="11" fill="#15803d">entana nafarana,</text>
    <text x="0" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-style="italic" font-size="11" fill="#15803d">entana tonga</text>
    <!-- Trait d'accentuation orange -->
    <path d="M 0,26 Q 40,29 80,25" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
