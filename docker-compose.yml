version: '3.8'

services:
    db:
    image: postgres:15-alpine
    environment:
    POSTGRES_DB: ivo_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password123
    volumes: pgdata:/var/lib/postgresql/data

    backend:
    build: ./backend
    ports:
                    "8000:8000"
    environment:
    DATABASE_URL: postgresql://postgres:password123@db:5432/ivo_db
    depends_on: db

    frontend:
    build: .
    ports: "80:80"
    depends_on: backend

